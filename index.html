<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三栖岛</title>
<style>
html,body{margin:0;height:100%;background:#05080c;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;color:#eef6f7;-webkit-font-smoothing:antialiased;user-select:none}
#gfx{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 110%,#0d4a5c 0%,#062230 45%,#04101a 100%);z-index:20;transition:opacity .9s}
#boot.hide{opacity:0;pointer-events:none}
#boot h1{font-weight:200;font-size:clamp(40px,7vw,96px);letter-spacing:.35em;margin:0 0 0 .35em;text-shadow:0 0 40px #3fd6e080}
#boot p{opacity:.7;letter-spacing:.3em;font-size:13px;margin:18px 0 0}
#bar{width:min(360px,60vw);height:2px;background:#ffffff22;margin-top:34px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#7fe9ee;transition:width .25s}
#err{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 14px;background:#3b0f14e0;border:1px solid #ff7a7a66;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;display:none;z-index:40}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
#hud .hide{display:none!important}
.panel{position:absolute;padding:10px 16px 11px;background:linear-gradient(180deg,#07141cb8,#07141c80);border-left:2px solid #7fe9ee;backdrop-filter:blur(6px);min-width:132px}
.panel .lab{font-size:12px;letter-spacing:.32em;opacity:.78}
.panel .big{font-size:34px;font-weight:300;line-height:1.1;margin-top:2px}
.panel .big small{font-size:12px;opacity:.6;margin-left:6px;letter-spacing:.12em}
.panel .sub{font-size:12px;opacity:.75;letter-spacing:.08em;margin-top:2px}
#h-tl{left:22px;top:20px}
#h-tr{right:22px;top:20px;border-left:0;border-right:2px solid #ffd84a;text-align:right}
#h-ch{left:50%;top:20px;transform:translateX(-50%);border-left:2px solid #ff7a3c;text-align:center;min-width:260px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
#h-count{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:150px;font-weight:200;text-shadow:0 0 44px #00e0ff,0 4px 30px #000a}
#h-res{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:14px 34px;font-size:26px;letter-spacing:.2em;background:#07141ccc;border-top:1px solid #ffd84a;border-bottom:1px solid #ffd84a;white-space:nowrap}
#h-hint{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);padding:7px 18px;font-size:14px;letter-spacing:.1em;background:#07141c99;border-radius:2px;white-space:nowrap}
#h-prompt{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);padding:10px 22px;font-size:17px;letter-spacing:.08em;background:#07141cd0;border-bottom:2px solid #7fe9ee;white-space:nowrap}
#h-keys{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;opacity:.72;text-shadow:0 1px 4px #000;white-space:nowrap}
#h-click{position:absolute;left:50%;top:56%;transform:translateX(-50%);padding:8px 20px;font-size:14px;letter-spacing:.2em;background:#07141caa;border:1px solid #ffffff33}
#map{position:absolute;inset:0;background:#030b10d9;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
#mapbox{display:flex;gap:22px;align-items:flex-start}
#mapc{height:min(82vh,82vw);width:min(82vh,82vw);border:1px solid #7fe9ee66;box-shadow:0 20px 80px #000}
#maplist{display:flex;flex-direction:column;gap:8px;min-width:190px}
#maplist button{all:unset;cursor:pointer;padding:9px 14px;background:#0d2a36;border-left:2px solid #7fe9ee;font-size:15px;letter-spacing:.08em}
#maplist button:hover{background:#15475a}
#maplist .leg{font-size:12px;opacity:.75;margin-top:6px;line-height:1.7}
#maplist .leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 8px}
#maphelp{margin-top:14px;font-size:13px;letter-spacing:.2em;opacity:.7}
</style>
</head>
